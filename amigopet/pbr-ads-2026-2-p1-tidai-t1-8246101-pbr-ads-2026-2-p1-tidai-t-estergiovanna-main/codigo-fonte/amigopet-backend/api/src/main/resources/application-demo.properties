# Perfil de demonstracao.
#
# Sobe a API com o H2 em memoria, ja populado com os dados de exemplo do
# script de MySQL (clinicas de Belo Horizonte, servicos, orientacoes e um
# tutor). Serve para rodar e apresentar o projeto em um computador que nao
# tem MySQL instalado.
#
# Como usar:
#   mvn spring-boot:run -Dspring-boot.run.profiles=demo

spring.datasource.url=jdbc:h2:mem:amigopet_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sobrescreve o dialeto fixo do MySQL definido em application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# O schema e criado pelo JPA e o seed roda logo em seguida.
# O deferrals garante que o Hibernate crie as tabelas antes do script.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:demo/seed.sql
spring.sql.init.encoding=UTF-8

server.port=8081
