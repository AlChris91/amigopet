# Configuracao de teste: banco em memoria H2, dispensando MySQL na maquina.
spring.datasource.url=jdbc:h2:mem:amigopet;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sobrescreve o dialeto fixo do MySQL definido em application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
